name: fetch

on:
  schedule:
    - cron: "5 */12 * * *"   # twice a day at 00:05 and 12:05 UTC
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0
      - name: Fetch gmcmap
        run: python scripts/fetch_gmcmap.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "data: $(date -u +%FT%TZ)"
            git push
          fi
